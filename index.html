 <script>

const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function saveStockPreview(){}

let messageTimer;
function message(text,error=false){clearTimeout(messageTimer);$('message').textContent=text;$('message').className=error?'error':'success';if(text)messageTimer=setTimeout(()=>{$('message').textContent='';},3000);}
function rpc(action,payload={}){return new Promise((resolve,reject)=>{
 if(['movement','movementBatch','movementBatchResult','saveItem','createProduct','editProduct','deleteItem','saveBarcode','internalBarcode','deleteBarcode','assignLot','expirySettings','saveLookup','editMovement','deleteMovement','patientDraft','patientConfirm','patientCorrect','patientCancel','patientDeleteCanceled'].includes(action)&&!payload.requestId)payload.requestId=crypto.randomUUID();
 fetch("https://ausjnipznteamkwnslro.supabase.co/functions/v1/gi-inventory", {
  method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',
  body:JSON.stringify({action,token:state.token,payload})
 }).then(response=>response.json()).then(r=>{
  if(!r?.ok)throw new Error(r?.error||'เกิดข้อผิดพลาด');
  if(!['bootstrap','scan','stockCard','movementHistory','movementHistoryPage','report','audit','patientState','movementStatus','catalogPage'].includes(action))invalidatePages();
  resolve(r.data);
 }).catch(reject);
});}
async function task(fn){if(state.productSave){message('มีสินค้าที่กำลังบันทึกหรือรอส่งซ้ำ กรุณาตรวจสถานะด้านบน',true);return;}const button=document.activeElement instanceof HTMLButtonElement?document.activeElement:null;if(button?.dataset.busy==='true')return;if(button){button.dataset.busy='true';button.setAttribute('aria-busy','true');button.disabled=true;}state.pendingTasks=(state.pendingTasks||0)+1;document.documentElement.dataset.pending=String(state.pendingTasks);try{await fn();}catch(e){message(e.message,true);}finally{state.pendingTasks=Math.max(0,(state.pendingTasks||1)-1);if(state.pendingTasks)document.documentElement.dataset.pending=String(state.pendingTasks);else delete document.documentElement.dataset.pending;if(button?.isConnected){button.disabled=false;button.removeAttribute('aria-busy');delete button.dataset.busy;}}}
function input(name,label,value='',type='text',attrs=''){return `<label>${esc(label)}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`;}
function select(name,label,rows,value='',key='ID',text='NAME'){return `<label>${esc(label)}<select name="${name}"><option value="">— เลือก —</option>${rows.map(r=>`<option value="${esc(r[key])}" ${String(r[key])===String(value)?'selected':''}>${esc(r[text])}</option>`).join('')}</select></label>`;}

 const cache=state.pageCache||(state.pageCache={});if(Object.keys(cache).length>40){for(const [k,e] of Object.entries(cache))if(!e.pending&&k!=='report'&&k!=='movementHistory')delete cache[k];}const key=Object.keys(payload).length?action+JSON.stringify(payload):action,entry=cache[key]||(cache[key]={data:null,at:0});
 if(entry.data!==null)update(entry.data);

 if(entry.pending&&!force){const sequence=entry.sequence,token=state.token;entry.pending.then(data=>{if(token===state.token&&cache===state.pageCache&&entry.sequence===sequence)update(data);}).catch(()=>{});return;}
 const sequence=entry.sequence=(entry.sequence||0)+1;
 const token=state.token;const pending=rpc(action,payload).then(data=>{if(token===state.token&&cache===state.pageCache&&sequence===entry.sequence){entry.data=data;entry.at=Date.now();update(data);}return data;}).finally(()=>{if(entry.pending===pending)entry.pending=null;});
 entry.pending=pending;
 pending.catch(e=>{if(token===state.token&&cache===state.pageCache&&sequence===entry.sequence)message('แสดงข้อมูลที่โหลดไว้ · อัปเดตล่าสุดไม่สำเร็จ: '+e.message,true);});

function createStockIndex(items,barcodes,lots){
 const children=new Map(),byBarcode=new Map(),byLot=new Map();
 for(const i of items){const code=String(i.PLAN_CODE||'');if(i.STATUS==='ACTIVE'&&/^\d+(?:\.\d+)+$/.test(code)){const root=code.split('.')[0];if(!children.has(root))children.set(root,[]);children.get(root).push(i);}}
 for(const b of barcodes){if(b.STATUS!=='ACTIVE')continue;if(!byBarcode.has(b.ITEM_ID))byBarcode.set(b.ITEM_ID,[]);byBarcode.get(b.ITEM_ID).push(b);}
 for(const lot of lots){if(lot.balance<=0)continue;if(!byLot.has(lot.itemId))byLot.set(lot.itemId,[]);byLot.get(lot.itemId).push(lot);}
 return {items,children,byBarcode,byLot};
}
function planChildItems(item,allItems=state.data.items){
 const code=String(item.PLAN_CODE||'').trim();if(!code||code.includes('.'))return [];if(state.stockIndex?.items===allItems)return state.stockIndex.children.get(code)||[];
 return allItems.filter(child=>child.ITEM_ID!==item.ITEM_ID&&child.STATUS==='ACTIVE'&&String(child.PLAN_CODE||'').startsWith(code+'.')&&/^\d+(?:\.\d+)+$/.test(String(child.PLAN_CODE||'')));
}
function stockDisplayBalance(item,allItems=state.data.items){return Number(item.BALANCE||0)+planChildItems(item,allItems).reduce((sum,child)=>sum+Number(child.BALANCE||0),0);}
function stockDisplayLots(item,allItems=state.data.items){if(state.stockIndex?.items===allItems)return [item,...planChildItems(item,allItems)].flatMap(i=>state.stockIndex.byLot.get(i.ITEM_ID)||[]);const ids=new Set([item.ITEM_ID,...planChildItems(item,allItems).map(child=>child.ITEM_ID)]);return (state.data.lots||[]).filter(lot=>ids.has(lot.itemId)&&lot.balance>0);}
function comparePlanCodes(a,b){
 const left=String(a.PLAN_CODE||'').trim(),right=String(b.PLAN_CODE||'').trim();
 if(!left||!right)return left? -1:right?1:0;
 const leftParts=left.split('.'),rightParts=right.split('.');
 for(let i=0;i<Math.max(leftParts.length,rightParts.length);i++){
  if(i>=leftParts.length)return -1;if(i>=rightParts.length)return 1;
  const x=leftParts[i],y=rightParts[i],xn=/^\d+$/.test(x),yn=/^\d+$/.test(y);
  if(xn&&yn){const diff=Number(x)-Number(y);if(diff)return diff;}
  else {const diff=x.localeCompare(y,'th',{numeric:true,sensitivity:'base'});if(diff)return diff;}
 }
 return 0;
}
function stockExpirySummary(item,allItems=state.data.items){

}

async function sendProductSave(job){
 if(job.running)return;job.running=true;job.error='';productSaveBanner();
 try{
  const saved=await rpc('editProduct',job.payload);
  if(saved.lots)state.data.lots=saved.lotsPartial?(state.data.lots||[]).filter(l=>l.itemId!==job.payload.id).concat(saved.lots):saved.lots;
  state.data.items=state.data.items.map(i=>i.ITEM_ID===job.payload.id?{...job.before,...saved.item}:i);
  state.data.barcodes=state.data.barcodes.filter(b=>b.ITEM_ID!==job.payload.id).concat(saved.barcodes);
  state.productSaves=state.productSaves.filter(x=>x!==job);state.productSave=state.productSaves[0]||null;invalidatePages();render();restoreStockScroll();message('บันทึกเข้าระบบเรียบร้อยแล้ว');

 }finally{job.running=false;pumpProductSaves();}

// Code 39: locally rendered labels; no stock data or codes sent to external services.
function code39(code){
 const chars='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-. $/+%*';
 const patterns=['nnnwwnwnn','wnnwnnnnw','nnwwnnnnw','wnwwnnnnn','nnnwwnnnw','wnnwwnnnn','nnwwwnnnn','nnnwnnwnw','wnnwnnwnn','nnwwnnwnn','wnnnnwnnw','nnwnnwnnw','wnwnnwnnn','nnnnwwnnw','wnnnwwnnn','nnwnwwnnn','nnnnnwwnw','wnnnnwwnn','nnwnnwwnn','nnnnwwwnn','wnnnnnnww','nnwnnnnww','wnwnnnnwn','nnnnwnnww','wnnnwnnwn','nnwnwnnwn','nnnnnnwww','wnnnnnwwn','nnwnnnwwn','nnnnwnwwn','wwnnnnnnw','nwwnnnnnw','wwwnnnnnn','nwnnwnnnw','wwnnwnnnn','nwwnwnnnn','nwnnnnwnw','wwnnnnwnn','nwwnnnwnn','nwnwnwnnn','nwnwnnnwn','nwnnnwnwn','nnnwnwnwn','nwnnwnwnn'];
 if(!/^[A-Z0-9 .\-$/+%]+$/.test(code))throw new Error('ฉลาก Code 39 รองรับตัวใหญ่ ตัวเลข และ - . space $ / + %');
 let x=12,rects='';for(const c of '*'+code+'*'){const pattern=patterns[chars.indexOf(c)];[...pattern].forEach((p,i)=>{const width=p==='w'?3:1;if(i%2===0)rects+=`<rect x="${x}" y="0" width="${width}" height="60"/>`;x+=width;});x+=1;}return `<svg viewBox="0 0 ${x+12} 60" role="img" aria-label="Barcode ${esc(code)}">${rects}</svg>`;
}

async function camera(onCode){

 if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia)throw new Error('อุปกรณ์นี้ไม่รองรับสแกนผ่านกล้อง ใช้เครื่องยิง USB/Bluetooth หรือกรอกรหัสได้');
 const supported=await BarcodeDetector.getSupportedFormats(),formats=['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf'].filter(f=>supported.includes(f));if(!formats.length)throw new Error('ไม่พบรูปแบบบาร์โค้ดที่กล้องรองรับ');

 state.detecting=true;const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
 if(!state.detecting||!$('dialog').open){stream.getTracks().forEach(t=>t.stop());return;}
 state.stream=stream;$('video').srcObject=stream;await $('video').play();const detector=new BarcodeDetector({formats});
 while(state.detecting&&$('dialog').open){const codes=await detector.detect($('video'));if(codes.length){stopCamera();$('dialog').close();onCode(codes[0].rawValue);return;}await new Promise(r=>setTimeout(r,180));}
 }catch(e){stopCamera();if($('dialog').open)$('dialog').close();message('เปิดกล้องไม่ได้: '+e.message+' · ใช้ช่องสแกนหรือกรอกรหัสแทน',true);}

function lotDays(l){if(!l?.expiry)return Infinity;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());return Math.round((Date.parse(l.expiry+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/86400000);}
function itemLots(id){return (state.data.lots||[]).filter(l=>l.itemId===id&&l.balance>0);}
function lotBadge(l){const days=lotDays(l);const text=l.unknown?'⚪ ยังไม่ระบุล็อต':l.noExpiry?'ไม่มีวันหมดอายุ':days<0?'🔴 หมดอายุ':days===0?'🟠 หมดอายุวันนี้':days<=30?'🟠 เหลือ '+days+' วัน':days<=(state.data.warningDays||90)?'🟡 เหลือ '+days+' วัน':'🟢 ปกติ';return '<span style="white-space:nowrap">'+esc(text)+'</span>';}
function expirySummary(id){const lots=itemLots(id),l=lots.filter(l=>l.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry))[0];return l?esc(l.expiry)+'<br>'+lotBadge(l):lots.some(l=>l.unknown)?'⚪ ยังไม่ระบุล็อต':'—';}
function lotTable(id){return table(['ล็อต','วันที่ผลิต','วันหมดอายุ','คงเหลือ','สถานะ'],itemLots(id).map(l=>'<tr><td>'+esc(l.number)+'</td><td>'+esc(l.manufactured||'—')+'</td><td>'+esc(l.expiry||(l.noExpiry?'ไม่มีวันหมดอายุ':'—'))+'</td><td>'+fmt(l.balance)+'</td><td>'+lotBadge(l)+'</td></tr>'));}
function assignExistingLot(id){modal('<h2>ระบุล็อตให้ยอดสินค้าเดิม</h2><p>ย้ายจำนวนที่ยังไม่ระบุล็อตไปล็อตนี้ ยอดรวมคงเดิม</p><form id="assignLotForm"><div class="grid">'+input('lotNumber','เลขล็อต','','text','required')+input('manufactured','วันที่ผลิต','','date')+input('expiry','วันหมดอายุ','','date')+input('quantity','จำนวนหน่วยฐาน',1,'number','min="0.000001" step="0.000001" required')+noExpiryControl()+'</div><button>บันทึกล็อต</button></form>');$('assignLotForm').onsubmit=e=>{e.preventDefault();const p=data(e.target);task(async()=>{const saved=await rpc('assignLot',{...p,itemId:id,requestId:crypto.randomUUID(),includeChanges:true});$('dialog').close();applyInventoryChanges(saved);productDetails(id);});};}
function expiryReport(report){const lots=(report.lots||state.data.lots||[]).filter(l=>l.balance>0&&lotDays(l)<=(report.warningDays||90)),expired=lots.filter(l=>lotDays(l)<0);return '<section class="card"><h2>⏰ เตือนวันหมดอายุ (ยอดปัจจุบัน)</h2><p>🔴 หมดอายุ '+expired.length+' ล็อต · 🟡 ใกล้หมดอายุ '+(lots.length-expired.length)+' ล็อต · เตือนล่วงหน้า '+(report.warningDays||90)+' วัน</p><button id="expiryDays" class="secondary">ตั้งวันเตือน</button>'+table(['สินค้า','ล็อต','วันหมดอายุ','คงเหลือ','มูลค่า','สถานะ'],lots.map(l=>{const i=report.items.find(i=>i.ITEM_ID===l.itemId)||{};return '<tr><td>'+esc(i.NAME)+'</td><td>'+esc(l.number)+'</td><td>'+esc(l.expiry)+'</td><td>'+fmt(l.balance)+' '+esc(i.UNIT)+'</td><td>฿'+fmt(l.balance*Number(i.PRICE))+'</td><td>'+lotBadge(l)+'</td></tr>';}))+'</section>';}
function expirySummaryBanner(){const lots=(state.data.lots||[]).filter(l=>l.balance>0&&lotDays(l)<=(state.data.warningDays||90)),expired=lots.filter(l=>lotDays(l)<0).length,near=lots.length-expired;return lots.length?'<div class="expiry-summary" role="group" aria-label="สรุปวันหมดอายุ"><button type="button" class="expiry-chip expired" data-expiry-filter="expired">⏰ หมดอายุ <strong>'+expired+'</strong> ล็อต</button><button type="button" class="expiry-chip near" data-expiry-filter="nearExpiry">ใกล้หมดอายุ <strong>'+near+'</strong> ล็อต</button></div>':'';}
async function restoreSession(){const token=sessionStorage.getItem(SESSION_STORAGE_KEY);if(!token)return;state.token=token;loginPending();const preview=readStockPreview(token);if(preview){$('app').style.pointerEvents='none';$('content').innerHTML='<h1>คลัง / ยอดคงเหลือ</h1><div class="card"><p role="status">กำลังตรวจสอบบัญชีและอัปเดตข้อมูลคลังล่าสุด…</p><p>ข้อมูลคลังจากการเปิดครั้งก่อน · '+preview.length+' รายการ</p>'+table(['รหัสวัสดุ','รหัสแผน','ชื่อสินค้า','คงเหลือ','หน่วย'],preview.map(i=>'<tr><td>'+esc(i[0])+'</td><td>'+esc(i[1])+'</td><td>'+esc(i[2])+'</td><td>'+fmt(i[3])+'</td><td>'+esc(i[4])+'</td></tr>'))+'</div>';}try{state.data=await rpc('bootstrap');state.page='stock';seedPages();nav();render();saveStockPreview();}catch(e){state.token=null;state.data=null;sessionStorage.removeItem(SESSION_STORAGE_KEY);sessionStorage.removeItem(STOCK_PREVIEW_KEY);$('app').hidden=true;$('login').hidden=false;message(e.message,true);}finally{$('app').style.pointerEvents='';}}
function noExpiryControl(){return '<label class="expiry-toggle"><input type="checkbox" name="noExpiry"><span class="expiry-toggle-text"><strong>ไม่มีวันหมดอายุ</strong><small>ไม่ต้องระบุวันที่หมดอายุ</small></span></label>';}
async function confirmMovementBatch(){
 if(state.batchSaving||state.productSave)return;
 if(!state.batchPending)state.batchPending={requestId:crypto.randomUUID(),items:state.movementQueue.map(p=>({...p}))};
 state.batchSaving=true;state.batchError='';if(state.page==='movement')movementPage();
 try{const saved=await rpc('movementBatchResult',{...state.batchPending,omitHistory:true});applyMovementBatchResult(saved);state.batchPending=null;state.batchSaving=false;state.batchError='';state.movementQueue=[];render();message('ยืนยันบันทึกทั้งหมดเข้าระบบแล้ว');}
 catch(error){state.batchSaving=false;state.batchError=error.message;if(state.page==='movement')movementPage();else message('ชุดรับเข้า / เบิกออกยังไม่สำเร็จ: '+error.message,true);}
}
function applyMovementBatchResult(saved){
 const balances=new Map(saved.balances.map(b=>[b.id,b.balance]));state.data.items=state.data.items.map(i=>balances.has(i.ITEM_ID)?{...i,BALANCE:balances.get(i.ITEM_ID)}:i);
 state.data.lots=saved.lotsPartial?(state.data.lots||[]).filter(l=>!balances.has(l.itemId)).concat(saved.lots):saved.lots;const ids=new Set(saved.transactions.map(t=>t.TX_ID));state.data.transactions=(state.data.transactions||[]).filter(t=>!ids.has(t.TX_ID)).concat(saved.transactions);state.data.history=saved.history;invalidatePages();
}
restoreSession();

 <script>

 $('patientBody').innerHTML='<div class="patient-tabs">'+tabs.map(([k,n])=>'<button type="button" class="'+(patientUI.tab===k?'active':'secondary')+'" data-patient-tab="'+k+'">'+n+'</button>').join('')+'</div><div id="patientTab"></div>';

 const keep=new Set(keepIds),map=new Map(state.data.items.filter(i=>keep.has(i.ITEM_ID)).map(i=>[i.ITEM_ID,i]));

function pageControls(page,total,limit,prefix){return '<p>'+fmt(total)+' รายการ · หน้า '+(page+1)+'</p><button type="button" id="'+prefix+'Prev" class="secondary" '+(page===0?'disabled':'')+'>ก่อนหน้า</button> <button type="button" id="'+prefix+'Next" class="secondary" '+((page+1)*limit>=total?'disabled':'')+'>ถัดไป</button>';}
function pagedStockProduct(item,rollup){
 const photo=/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(item.IMAGE||'')
   ?'<img class="stock-photo" src="'+esc(item.IMAGE)+'" alt="" width="44" height="44" loading="lazy" decoding="async">'
   :'';

   (rollup?.children?'<small>รวม '+fmt(rollup.children)+' รหัสย่อย</small>':'')+'</span></div>';

function pagedStockExpiry(lots,warningDays){
 const remaining=lots.filter(l=>Number(l.balance)>0);
 const dated=remaining.filter(l=>l.expiry).sort((a,b)=>a.expiry.localeCompare(b.expiry))
   .map(l=>({lot:l,days:lotDays(l)})).filter(entry=>Number.isFinite(entry.days));
 const nearest=dated[0];
 if(!nearest){
  const label=remaining.some(l=>l.unknown)?'ยังไม่ระบุล็อต':remaining.length&&remaining.every(l=>l.noExpiry)?'ไม่มีวันหมดอายุ':remaining.length?'ไม่ระบุวันหมดอายุ':'—';
  return '<span class="stock-expiry-muted">'+label+'</span>';
 }
 const badge=entry=>{
  const days=entry.days;
  const style=days<0?'expired':days<=warningDays?'near':'regular';
  const label=days<0?'หมดอายุ':days===0?'หมดอายุวันนี้':days<=warningDays?'ใกล้หมดอายุ · '+fmt(days)+' วัน':'ปกติ';
  return '<time datetime="'+esc(entry.lot.expiry)+'">'+esc(entry.lot.expiry)+'</time><span class="stock-expiry-badge '+style+'">'+label+'</span>';
 };
 const upcoming=nearest.days<0&&dated.find(entry=>entry.days>=0&&entry.days<=warningDays);
 return '<div class="stock-expiry">'+badge(nearest)+(upcoming?badge(upcoming):'')+'</div>';
}

  mergePageItems(page,keep);active.splice(0,active.length,...state.data.items.filter(i=>i.STATUS==='ACTIVE'));
  const previous=form.elements.itemId.value;form.elements.itemId.innerHTML='<option value="">— เลือก —</option>'+active.map(i=>'<option value="'+esc(i.ITEM_ID)+'">'+esc(i.NAME)+'</option>').join('');form.elements.itemId.value=previous;
  target.innerHTML=table(['รหัส','สินค้า','คงเหลือ'],page.items.map(i=>'<tr data-movement-item="'+esc(i.ITEM_ID)+'"><td>'+esc(i.MATERIAL_CODE)+'</td><td>'+esc(i.NAME)+'</td><td>'+fmt(i.BALANCE)+' '+esc(i.UNIT)+'</td></tr>'));
  if(exact){form.elements.itemId.value=r.item.ITEM_ID;form.elements.itemId.dispatchEvent(new Event('change'));form.elements.barcode.value=r.barcode.BARCODE;form.elements.quantity.focus();form.elements.quantity.select();}
 }catch(e){if(version===seq&&$('movementForm')===form)message(e.message,true);}};
 search.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(search.value),300);};search.onchange=null;search.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);load(search.value,true);}};$('scanButton').onclick=()=>load(search.value);$('camera').onclick=()=>camera(code=>{search.value=code;load(code,true);});
};
reportsPage=function(){
 if(!state.data.PAGED)return oldReportsPage();
 let page=0,historyPage=0,seq=0,report;const today=new Date(Date.now()+7*3600000).toISOString().slice(0,10);
 $('content').innerHTML='<h1>สรุปรายงานคลังวัสดุ</h1><div class="card"><label>เริ่มต้น<input id="reportStart" type="date" value="'+today+'"></label><label>สิ้นสุด<input id="reportDate" type="date" value="'+today+'"></label><button id="refreshReport">อัปเดต</button><button id="dailyCsv">ส่งออกรายงาน CSV</button><button id="txReport">ส่งออกประวัติ CSV</button><button id="stockReport">ยอดปัจจุบัน CSV</button><button id="lowReport">ถึงจุดสั่งซื้อ CSV</button><button id="auditReport">Audit Log</button></div><div id="reportDashboard">กำลังโหลด…</div><h2>ประวัติในช่วงวันที่เลือก</h2><div id="reportHistory"></div>';
 const target=$('reportDashboard'),token=state.token;
 const load=async()=>{const version=++seq;try{const payload={start:$('reportStart').value,end:$('reportDate').value,page,limit:50};const [r,h]=await Promise.all([rpc('report',payload),rpc('movementHistoryPage',{...payload,page:historyPage})]);if(version!==seq||token!==state.token||$('reportDashboard')!==target)return;report=r;
  const s=r.summary;target.innerHTML='<div class="metrics"><div class="card">รับเข้า<strong>'+fmt(s.receivedCount)+' ครั้ง</strong></div><div class="card">เบิกออก<strong>'+fmt(s.issuedCount)+' ครั้ง</strong></div><div class="card">มูลค่าสิ้นวัน<strong>฿'+fmt(s.value)+'</strong></div><div class="card">หมด / ถึงจุดสั่งซื้อ<strong>'+fmt(s.empty)+' / '+fmt(s.low)+'</strong></div></div><div class="card"><h2>สินค้าที่เบิกบ่อย</h2>'+table(['สินค้า','จำนวนครั้ง','จำนวนฐาน','มูลค่า'],r.top.map(i=>'<tr><td>'+esc(i.NAME)+'</td><td>'+fmt(i.out_count)+'</td><td>'+fmt(i.issued)+'</td><td>'+fmt(i.issue_value)+'</td></tr>'))+'</div>'+pageControls(page,r.total,r.limit,'report')+table(['รหัส','สินค้า','หน่วย','รับเข้า','เบิกออก','คงเหลือสิ้นวัน'],r.daily.map(i=>'<tr><td>'+esc(i.MATERIAL_CODE)+'</td><td>'+esc(i.NAME)+'</td><td>'+esc(i.UNIT)+'</td><td>'+fmt(i.received)+'</td><td>'+fmt(i.issued)+'</td><td>'+fmt(i.closing)+'</td></tr>'))+expiryReport(r);
  $('reportPrev').onclick=()=>{page--;load();};$('reportNext').onclick=()=>{page++;load();};
  $('reportHistory').innerHTML=pageControls(h.page,h.total,h.limit,'reportHistory')+table(['วันที่','ประเภท','สินค้า','จำนวน','ล็อต','หมายเหตุ'],h.rows.map(t=>'<tr><td>'+esc(new Date(t.CREATED_AT).toLocaleString('th-TH'))+'</td><td>'+esc(t.TYPE)+'</td><td>'+esc(t.ITEM_NAME||t.ITEM_ID)+'</td><td>'+fmt(t.BASE_QTY)+'</td><td>'+esc(t.LOT_NUMBER)+'</td><td>'+esc(t.NOTE)+'</td></tr>'));
  $('reportHistoryPrev').onclick=()=>{historyPage=Math.max(0,h.page-1);load();};$('reportHistoryNext').onclick=()=>{historyPage=h.page+1;load();};
 }catch(e){if(version===seq&&$('reportDashboard')===target)target.textContent=e.message;}};
 $('refreshReport').onclick=load;$('reportStart').onchange=$('reportDate').onchange=()=>{page=0;historyPage=0;load();};
 const exportPages=async(action,key)=>{const rows=[];let p=0,total=Infinity;while(rows.length<total){const r=await rpc(action,{start:$('reportStart').value,end:$('reportDate').value,page:p++,limit:100});const next=r[key];total=r.total;if(!next.length)break;rows.push(...next);}csv(action,rows);};
 target.onclick=e=>{if(e.target.id==='expiryDays'){const days=prompt('เตือนล่วงหน้ากี่วัน (1–365)',state.data.warningDays||90);if(days!==null)task(async()=>{state.data.warningDays=await rpc('expirySettings',{days:Number(days)});load();});}};
 $('stockReport').onclick=()=>task(async()=>{const rows=[];let n=0,total=Infinity;while(rows.length<total){const r=await rpc('catalogPage',{page:n++,limit:100});total=r.total;if(!r.items.length)break;rows.push(...r.items);}csv('stock-active',rows);});
 $('lowReport').onclick=()=>task(async()=>{const rows=[];let n=0,total=Infinity;while(n*100<total){const r=await rpc('report',{start:$('reportStart').value,end:$('reportDate').value,page:n++,limit:100});total=r.total;rows.push(...r.lowStock);}csv('low-stock-end-of-range',rows);});
 $('auditReport').onclick=()=>task(async()=>csv('audit',await rpc('audit')));
 $('dailyCsv').onclick=()=>task(()=>exportPages('report','daily'));$('txReport').onclick=()=>task(()=>exportPages('movementHistoryPage','rows'));load();
};
patientUsagePage=function(){
 if(!state.data.PAGED)return oldPatientPage();
 let tab=patientUI.tab||'use',page=0,seq=0,timer;const token=state.token;
 $('content').innerHTML='<h1>วัสดุใช้กับผู้ป่วย</h1><div class="card"><button data-ptab="use">บันทึกใช้</button><button data-ptab="balance">ยอดพร้อมใช้</button><button data-ptab="history">ประวัติ</button><button data-ptab="report">รายงาน</button></div><div id="patientRemote"></div>';
 const target=$('patientRemote'),departments=state.data.departments,depOptions='<option value="">ทุกหน่วยงาน</option>'+departments.filter(d=>d.STATUS==='ACTIVE').map(d=>'<option value="'+esc(d.ID)+'">'+esc(d.NAME)+'</option>').join('');
 const alive=version=>version===seq&&token===state.token&&$('patientRemote')===target;
 function draw(){
  patientUI.tab=tab;page=0;seq++;
  if(tab==='use'){
   const today=new Date(Date.now()+7*3600000).toISOString().slice(0,16);
   target.innerHTML='<div class="card"><h2>บันทึกใช้กับผู้ป่วย</h2><label>วันเวลาใช้<input id="patientUsedAt" type="datetime-local" value="'+today+'" required></label><label>HN<input id="patientHN" maxlength="250" required></label><label>หน่วยงาน<select id="patientUseDept">'+depOptions+'</select></label><label>หมายเหตุ<input id="patientNote" maxlength="1000"></label><input id="patientProductSearch" placeholder="ชื่อ รหัส หรือ Barcode"><div id="patientAvailablePaging"></div><select id="patientAvailable"></select><label>จำนวน<input id="patientQty" type="number" min="1" step="1" value="1"></label><button id="patientAdd">เพิ่มสินค้า</button><div id="patientLines"></div><button id="patientConfirm">ยืนยันการใช้</button><p id="patientRemoteStatus" role="status"></p></div>';
   const prefill=patientUI.prefill;patientUI.prefill=null;const lines=(prefill?.lines||[]).map(l=>({...l,lotName:l.lotId})),items=new Map((patientUI.prefillItems||[]).map(i=>[i.ITEM_ID,i]));let available=[],pending=null,draftId=prefill?.id||'';
   if(prefill){$('patientHN').value=prefill.hn;$('patientUseDept').value=prefill.departmentId;$('patientNote').value=prefill.note||'';$('patientUsedAt').value=new Date(Date.parse(prefill.usedAt)+7*3600000).toISOString().slice(0,16);}
   const drawLines=()=>{$('patientLines').innerHTML=table(['สินค้า','ล็อต','จำนวน',''],lines.map((l,n)=>'<tr><td>'+esc(items.get(l.itemId)?.NAME||l.itemId)+'</td><td>'+esc(l.lotName)+'</td><td>'+fmt(l.quantity)+'</td><td><button data-remove-line="'+n+'">ลบ</button></td></tr>'));};
   const loadAvailable=async()=>{const version=++seq;try{const r=await rpc('patientState',{departmentId:$('patientUseDept').value,query:$('patientProductSearch').value,available:true,page,limit:50});if(!alive(version))return;available=r.balances;r.items.forEach(i=>items.set(i.ITEM_ID,i));$('patientAvailable').innerHTML='<option value="">เลือกสินค้าและล็อต</option>'+available.map((b,n)=>'<option value="'+n+'">'+esc((items.get(b.itemId)?.MATERIAL_CODE||'')+' · '+(items.get(b.itemId)?.NAME||b.itemId)+' · '+b.lotNumber+' · '+(b.expiry||'ไม่ระบุวันหมดอายุ')+' · เหลือ '+fmt(b.available))+'</option>').join('');$('patientAvailablePaging').innerHTML=pageControls(page,r.balanceTotal,r.limit,'patientAvailable');$('patientAvailablePrev').onclick=()=>{page--;loadAvailable();};$('patientAvailableNext').onclick=()=>{page++;loadAvailable();};}catch(e){if(alive(version))$('patientRemoteStatus').textContent=e.message;}};
   $('patientUseDept').onchange=()=>{lines.length=0;pending=null;page=0;drawLines();loadAvailable();};$('patientProductSearch').oninput=()=>{clearTimeout(timer);page=0;timer=setTimeout(loadAvailable,300);};$('patientProductSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(timer);loadAvailable();}};
   $('patientAdd').onclick=()=>{const v=$('patientAvailable').value,b=v===''?null:available[Number(v)],qty=Number($('patientQty').value);if(!b||!$('patientUseDept').value||b.departmentId!==$('patientUseDept').value||!Number.isSafeInteger(qty)||qty<1){message('เลือกหน่วยงาน สินค้า และจำนวนเต็มตั้งแต่ 1',true);return;}const old=lines.find(l=>l.itemId===b.itemId&&l.lotId===b.lotId);if((old?.quantity||0)+qty>b.available){message('จำนวนเกินยอดพร้อมใช้',true);return;}if(old)old.quantity+=qty;else lines.push({itemId:b.itemId,lotId:b.lotId,quantity:qty,lotName:b.lotNumber});pending=null;drawLines();};
   $('patientLines').onclick=e=>{if(e.target.dataset.removeLine!==undefined){lines.splice(Number(e.target.dataset.removeLine),1);pending=null;drawLines();}};
   $('patientConfirm').onclick=()=>task(async()=>{const payload={rootId:draftId,usedAt:$('patientUsedAt').value+'+07:00',hn:$('patientHN').value.trim(),departmentId:$('patientUseDept').value,note:$('patientNote').value,lines:lines.map(({itemId,lotId,quantity})=>({itemId,lotId,quantity}))};if(!payload.hn||!payload.departmentId||!payload.lines.length){message('กรอก HN หน่วยงาน และเพิ่มวัสดุก่อนยืนยัน',true);return;}const signature=JSON.stringify(payload);if(!pending||pending.signature!==signature)pending={signature,payload:{...payload,requestId:crypto.randomUUID()}};await rpc('patientConfirm',pending.payload);pending=null;draftId='';lines.length=0;drawLines();message('ยืนยันการใช้สำเร็จ');loadAvailable();});
   drawLines();loadAvailable();return;
  }
  target.innerHTML='<div class="card"><input id="patientRemoteSearch" placeholder="ค้นหา '+(tab==='balance'?'ชื่อ รหัส หรือ Barcode':'HN หรือสินค้า')+'"><select id="patientRemoteDept">'+depOptions+'</select>'+(tab==='balance'?'':'<input type="date" id="patientRemoteFrom"><input type="date" id="patientRemoteTo">')+(tab==='report'?'<button id="patientRemoteCsv">ส่งออก CSV</button>':'')+'<div id="patientRemoteTable">กำลังโหลด…</div></div>';
  const payload=()=>({page,limit:50,query:$('patientRemoteSearch').value,departmentId:$('patientRemoteDept').value,start:$('patientRemoteFrom')?.value,end:$('patientRemoteTo')?.value});let current;
  const load=async()=>{const version=++seq;try{const r=await rpc('patientState',payload());if(!alive(version))return;current=r;const isBalance=tab==='balance',rows=isBalance?r.balances:r.uses,names=new Map(r.items.map(i=>[i.ITEM_ID,i]));
   $('patientRemoteTable').innerHTML=pageControls(page,isBalance?r.balanceTotal:r.useTotal,r.limit,'patientRemote')+(isBalance?table(['หน่วยงาน','สินค้า','ล็อต','รับจากคลัง','ใช้','ปรับยอด','พร้อมใช้'],rows.map(b=>'<tr><td>'+esc(departments.find(d=>d.ID===b.departmentId)?.NAME||'—')+'</td><td>'+esc(names.get(b.itemId)?.NAME||b.itemId)+'</td><td>'+esc(b.lotNumber)+'</td><td>'+fmt(b.received)+'</td><td>'+fmt(b.used)+'</td><td>'+fmt(b.adjusted)+'</td><td class="'+(b.anomaly?'error':'')+'">'+fmt(b.available)+'</td></tr>')):table(['วันเวลา','HN','หน่วยงาน','วัสดุ','สถานะ','จัดการ'],rows.map(u=>'<tr><td>'+esc(patientDate(u.usedAt))+'</td><td>'+esc(u.hn)+'</td><td>'+esc(departments.find(d=>d.ID===u.departmentId)?.NAME||'—')+'</td><td>'+u.lines.map(l=>esc((names.get(l.itemId)?.NAME||l.itemId)+' × '+fmt(l.quantity))).join('<br>')+'</td><td>'+esc(u.status)+'</td><td><button data-pdetail="'+esc(u.id)+'">รายละเอียด</button>'+(u.status==='DRAFT'&&u.userId===state.data.user.USER_ID?'<button data-presume="'+esc(u.id)+'">เปิดฉบับร่าง</button>':'')+(admin()&&u.status==='CONFIRMED'?'<button data-pcorrect="'+esc(u.id)+'">แก้จำนวน</button><button data-pcancel="'+esc(u.id)+'">ยกเลิก</button>':'')+(admin()&&u.status==='CANCELED'?'<button data-pdelete="'+esc(u.id)+'">ลบออก</button>':'')+'</td></tr>')));
   $('patientRemotePrev').onclick=()=>{page--;load();};$('patientRemoteNext').onclick=()=>{page++;load();};
  }catch(e){if(alive(version))$('patientRemoteTable').textContent=e.message;}};
  ['patientRemoteSearch','patientRemoteDept','patientRemoteFrom','patientRemoteTo'].forEach(id=>{if($(id))$(id).oninput=()=>{clearTimeout(timer);page=0;timer=setTimeout(load,300);};});
  $('patientRemoteTable').onclick=e=>{const id=e.target.dataset.presume||e.target.dataset.pdetail||e.target.dataset.pcorrect||e.target.dataset.pcancel||e.target.dataset.pdelete;if(!id)return;const u=current.uses.find(u=>u.id===id);if(!u)return;
   if(e.target.dataset.presume){patientUI.prefill=u;patientUI.prefillItems=current.items;tab='use';draw();return;}
   if(e.target.dataset.pdetail){modal('<h2>HN '+esc(u.hn)+'</h2><p>'+esc(patientDate(u.usedAt))+'</p>'+table(['สินค้า','ล็อต','จำนวน'],u.lines.map(l=>'<tr><td>'+esc(current.items.find(i=>i.ITEM_ID===l.itemId)?.NAME||l.itemId)+'</td><td>'+esc(l.lotId)+'</td><td>'+fmt(l.quantity)+'</td></tr>')));return;}
   if(e.target.dataset.pcorrect){modal('<h2>แก้จำนวน</h2>'+u.lines.map((l,n)=>'<label>'+esc(current.items.find(i=>i.ITEM_ID===l.itemId)?.NAME||l.itemId)+'<input type="number" min="1" step="1" id="remoteCorrect'+n+'" value="'+l.quantity+'"></label>').join('')+'<button id="remoteCorrectSave">บันทึก</button>');$('remoteCorrectSave').onclick=()=>task(async()=>{const lines=u.lines.map((l,n)=>({...l,quantity:Number($('remoteCorrect'+n).value)}));await rpc('patientCorrect',{rootId:id,requestId:crypto.randomUUID(),lines});$('dialog').close();load();});return;}
   if(e.target.dataset.pcancel){const reason=prompt('เหตุผลยกเลิก');if(!reason)return;const returnToAvailable=confirm('คืนยอดพร้อมใช้หรือไม่? ตกลงเมื่อยังไม่ได้ใช้จริง');task(async()=>{await rpc('patientCancel',{rootId:id,requestId:crypto.randomUUID(),reason,returnToAvailable});load();});return;}
   if(e.target.dataset.pdelete&&confirm('นำรายการที่ยกเลิกออกจากประวัติ? ยังคงเก็บร่องรอยในระบบ'))task(async()=>{await rpc('patientDeleteCanceled',{rootId:id,requestId:crypto.randomUUID()});load();});
  };
  if($('patientRemoteCsv'))$('patientRemoteCsv').onclick=()=>task(async()=>{const all=[];let n=0,total=Infinity;while(all.length<total){const r=await rpc('patientState',{...payload(),page:n++,limit:100});total=r.useTotal;if(!r.uses.length)break;all.push(...r.uses.map(u=>({...u,lines:JSON.stringify(u.lines)})));}csv('patient-usage',all);});load();
 }
 document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{if(tab==='use'&&$('patientLines')?.querySelector('tbody button')&&!confirm('ออกจากหน้าบันทึกโดยไม่บันทึกรายการที่เลือก?'))return;tab=b.dataset.ptab;draw();});draw();
};
